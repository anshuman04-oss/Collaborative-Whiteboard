name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' 

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/whiteboard_personal
            
            git pull origin main
            
            cd backend
            
            sudo docker build -t whiteboard-backend .
            
            sudo docker stop whiteboard-backend-container || true
            sudo docker rm whiteboard-backend-container || true
            
            sudo docker run -p 5000:5000 --env-file .env -d --name whiteboard-backend-container whiteboard-backend